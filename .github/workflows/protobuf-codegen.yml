name: Protobuf Codegen

# Regenerates spatialreal/proto/generated/ and commits it once the gate passes.
#
# Trigger: shared-proto's tag CI dispatches this workflow; it can also be run by hand here.
# Pushes and PRs do not trigger it: the contract is released only when shared-proto is tagged.
# workflow_dispatch only finds workflows that are on the default branch.
#
# Auth: the org GitHub App `spatialreal-codegen` (secrets CODEGEN_APP_ID /
# CODEGEN_APP_PRIVATE_KEY), not a personal token. The App installation must include this repo.

on:
  workflow_dispatch:
    inputs:
      shared_proto_ref:
        description: shared-proto ref (tag / branch / sha)
        type: string
        required: false
        default: main

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEGEN_APP_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout shared-proto
        uses: actions/checkout@v5
        with:
          repository: SpatialReal-ai/shared-proto
          ref: ${{ inputs.shared_proto_ref || 'main' }}
          token: ${{ steps.app-token.outputs.token }}
          path: proto-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # grpcio-tools is pinned in the dev extra: it decides the gencode protobuf version, which
      # must stay <= the runtime protobuf the SDK is installed alongside (livekit-agents venvs run
      # protobuf 6.x). Bump it only in a commit of its own.
      - name: Install (dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Generate
        id: gen
        run: |
          echo "short_sha=$(git -C proto-src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          out="$(mktemp -d)"
          python -m grpc_tools.protoc -I proto-src/clients/python-sdk \
            --python_out="$out" --pyi_out="$out" driveningress/v2/driveningress.proto
          mv "$out/driveningress/v2/driveningress_pb2.py" spatialreal/proto/generated/message_pb2.py
          mv "$out/driveningress/v2/driveningress_pb2.pyi" spatialreal/proto/generated/message_pb2.pyi
          rm -rf proto-src "$out"
          git status --short spatialreal/proto/generated

      # Gate: the package still imports (the generated module loads against the installed protobuf
      # runtime) and the protocol tests pass. A failure usually means SDK code relies on something
      # the generated code no longer has — fix that first, then re-run.
      - name: Gate — import smoke test
        run: python -c "import spatialreal"

      - name: Gate — unit tests
        run: python -m pytest tests -q

      - name: Gate — generated code only
        run: |
          if git ls-files --others --cached --exclude-standard '*.proto' | grep .; then
            echo "Only generated code is committed here." >&2
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spatialreal/proto/generated
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(proto): regenerate from shared-proto@${{ inputs.shared_proto_ref || 'main' }} (${{ steps.gen.outputs.short_sha }})"
          git push
