name: Protobuf Codegen

# Syncs the driveningress contract from SpatialReal-ai/shared-proto into proto/, regenerates
# spatialreal/proto/generated/ with scripts/gen_proto.sh, and commits both once the gate passes.
#
# Trigger: shared-proto's tag CI dispatches this workflow; it can also be run by hand here.
# Pushes and PRs do not trigger it: the contract is released only when shared-proto is tagged.
# workflow_dispatch only finds workflows that are on the default branch.
#
# Auth: the org GitHub App `spatialreal-codegen` (secrets CODEGEN_APP_ID /
# CODEGEN_APP_PRIVATE_KEY), not a personal token. The App installation must include this repo.
#
# proto/ is a committed, read-only copy of the contract that the generated code is built from;
# proto/SHARED_PROTO_COMMIT records which shared-proto commit it came from. A manual sync (when
# Actions is down) does the same steps by hand and commits both — see CLAUDE.md "Contracts (proto)".

on:
  workflow_dispatch:
    inputs:
      shared_proto_ref:
        description: shared-proto ref (tag / branch / sha)
        type: string
        required: false
        default: main

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEGEN_APP_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout shared-proto
        uses: actions/checkout@v5
        with:
          repository: SpatialReal-ai/shared-proto
          ref: ${{ inputs.shared_proto_ref || 'main' }}
          token: ${{ steps.app-token.outputs.token }}
          path: proto-src

      # Replace the vendored contract file, then record the exact commit it came from.
      # driveningress.proto imports only google/protobuf/struct.proto (a well-known type protoc
      # ships), so this one file is the whole build input — no other .proto is copied.
      - name: Sync vendored proto
        id: sync
        run: |
          echo "sha=$(git -C proto-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git -C proto-src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          cp proto-src/driveningress/v2/driveningress.proto proto/driveningress/v2/driveningress.proto
          git -C proto-src rev-parse HEAD > proto/SHARED_PROTO_COMMIT
          rm -rf proto-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # grpcio-tools is pinned in the dev extra; it decides the gencode protobuf version, which
      # must stay <= the runtime protobuf the SDK is installed alongside (see scripts/gen_proto.sh).
      - name: Install (dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Generate
        run: |
          ./scripts/gen_proto.sh
          test -f spatialreal/proto/generated/message_pb2.py
          git status --short proto spatialreal/proto/generated

      # Gate: the package still imports (the generated module loads against the installed protobuf
      # runtime) and the protocol tests pass. A failure usually means SDK code relies on something
      # the contract no longer has — fix the SDK (or the contract in shared-proto) first, then re-run.
      - name: Gate — import smoke test
        run: python -c "import spatialreal"

      - name: Gate — unit tests
        run: python -m pytest tests -q

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proto spatialreal/proto/generated
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(proto): sync from shared-proto@${{ inputs.shared_proto_ref || 'main' }} (${{ steps.sync.outputs.short_sha }})"
          git push
