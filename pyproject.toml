[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatialreal"
dynamic = ["version"]
description = "SpatialReal Python SDK — realtime avatar sessions (audio in, animation/egress out)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
authors = [{ name = "SpatialReal", email = "hello@spatialreal.com" }]
keywords = ["avatar", "realtime", "audio", "websocket", "spatialreal"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12",
    "protobuf>=6.31,<8",
    "nanoid>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "grpcio-tools==1.75.1", "ruff"]

[project.urls]
Documentation = "https://docs.spatialreal.com"
Website = "https://www.spatialreal.ai/"
Source = "https://github.com/SpatialReal-ai/python-sdk"

[tool.hatch.version]
path = "spatialreal/version.py"

[tool.hatch.build.targets.wheel]
packages = ["spatialreal"]

[tool.hatch.build.targets.sdist]
include = ["/spatialreal", "/proto"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["spatialreal/proto/generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
