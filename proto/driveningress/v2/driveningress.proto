// driveningress.v2 — the user <-> driven-server realtime session protocol.
// Kept as the production contract; asset-serving RPCs were removed (avatars are now
// inlined per request by the backend; see inferenceserver/v1 for the inference contract).

syntax = "proto3";

package driveningress.v2;

import "google/protobuf/struct.proto";

option go_package = "github.com/SpatialReal-ai/backend-ng/api/generated/driveningress/v2";

enum MessageType {
  MESSAGE_UNSPECIFIED = 0;
  MESSAGE_CLIENT_CONFIGURE_SESSION = 1; // 协商会话参数
  MESSAGE_SERVER_CONFIRM_SESSION = 2; // 确认协商成功
  MESSAGE_CLIENT_AUDIO_INPUT = 3;
  MESSAGE_SERVER_ERROR = 4;
  MESSAGE_SERVER_RESPONSE_ANIMATION = 5;
  MESSAGE_CLIENT_DRIVEN_CONFIG = 6; // 驱动配置消息
  MESSAGE_CLIENT_INTERRUPT = 7; // 打断
  // 服务端 pause / resume(仅 egress 模式;服务端在 ServerConfirmSession.capabilities 里声明 "playback_control")。
  // 与 interrupt 的本质区别:不取消生成、不丢缓冲,恢复后从同一位置继续 —— 零空档、零误差、不重新生成。
  MESSAGE_CLIENT_PAUSE = 8;
  MESSAGE_CLIENT_RESUME = 9;
  // 服务端播放状态回执(能力 "playback_state")。每条 CLIENT_PAUSE / CLIENT_RESUME 都必有一条回执;
  // 播放被打断时也发一条 INTERRUPTED 带位置(客户反馈第 4 条)。老客户端对未知类型静默忽略。
  MESSAGE_SERVER_PLAYBACK_STATE = 10;
}

enum AudioFormat {
  AUDIO_FORMAT_PCM_S16LE = 0;
  AUDIO_FORMAT_OGG_OPUS = 1;
}

enum TransportCompression {
  TRANSPORT_COMPRESSION_NONE = 0;
}

// EgressType specifies how animation and audio data should be delivered
enum EgressType {
  EGRESS_TYPE_UNSPECIFIED = 0; // Default: return animation data via WebSocket
  EGRESS_TYPE_LIVEKIT = 1;     // Stream to LiveKit room via egress service
  EGRESS_TYPE_AGORA = 2;       // Stream to Agora channel via egress service
}

// CloseCode is the WebSocket close code the server sends when it ends a session, and
// the value carried in ServerError.code.
//
// Delivery: the server sends a ServerError carrying the code, then closes the socket with
// the same code — at the handshake (a refused session) and in-session (credits exhausted,
// session ceiling reached). A client may act on whichever arrives first.
//
// These are a client contract, not diagnostics: the SDK branches on them to decide
// whether to reconnect. Picking the wrong one is a behavioural bug, not a wording one —
// a retryable failure reported as CLOSE_CODE_AUTH_FAILED makes the client give up for good.
//
// Ranges: 40xx means the request itself is at fault and retrying changes nothing;
// 45xx means the server is briefly unable and the client should retry.
enum CloseCode {
  CLOSE_CODE_UNSPECIFIED = 0;

  // Out of credits. Do not reconnect — retrying cannot succeed until the account is topped up.
  CLOSE_CODE_CREDITS_EXHAUSTED = 4001;

  // Session hit its maximum duration. Reconnect is allowed and expected.
  CLOSE_CODE_SESSION_TIMEOUT = 4002;

  // Too many concurrent connections for the plan. Do not reconnect immediately; a slot
  // has to free up first.
  CLOSE_CODE_CONCURRENCY_LIMIT = 4003;

  // Bad or expired session token, or app_id mismatch. Do not reconnect — the client
  // needs a fresh token first.
  CLOSE_CODE_AUTH_FAILED = 4010;

  // A server-side dependency is briefly unavailable: the control plane is rolling, a
  // network blip, or it answered 5xx. **Reconnect, ideally with backoff.** Distinct from
  // AUTH_FAILED precisely so that a few seconds of deploy does not read to the client as
  // "your credentials are bad, stop trying".
  CLOSE_CODE_UPSTREAM_UNAVAILABLE = 4503;
}

// LiveKitEgressConfig contains configuration for streaming to a LiveKit room
message LiveKitEgressConfig {
  // LiveKit server URL (e.g., wss://livekit.example.com)
  string url = 1;
  // LiveKit API key. Optional when api_token is provided.
  string api_key = 2;
  // LiveKit API secret. Optional when api_token is provided.
  string api_secret = 3;
  // LiveKit room name to join
  string room_name = 4;
  // Publisher identity in the room
  string publisher_id = 5;
  // Extra attributes
  map<string, string> extra_attributes = 6;
  // Idle timeout in seconds. Server closes the connection when it is completely silent.
  int32 idle_timeout = 7;
  // Pre-generated LiveKit access token. When set, backend should prefer this over api_key/api_secret.
  string api_token = 8;
}

// AgoraEgressConfig contains configuration for streaming to an Agora channel
message AgoraEgressConfig {
  // Agora channel name to join
  string channel_name = 1;
  // Agora token for authentication (optional for testing)
  string token = 2;
  // Publisher UID in the channel (0 for auto-assign)
  uint32 uid = 3;
  // Publisher identity/name
  string publisher_id = 4;
}

// DrivenIngressConfig contains driven server configuration
message DrivenIngressConfig {
  // Base64 encoded shape.npy data
  bytes shape_npy = 1;

  // Base64 encoded style.npy data
  bytes style_npy = 2;

  // Driven server URL
  string driven_server_url = 3;

  // Model settings JSON
  google.protobuf.Struct model_settings = 4;

  // Encoder start frame (default: 0)
  int32 encoder_start_frame = 5;
}

message ClientConfigureSession {
  int32 sample_rate = 1;
  int32 bitrate = 2;
  // AUDIO_FORMAT_PCM_S16LE sends raw PCM16 mono audio at sample_rate.
  // AUDIO_FORMAT_OGG_OPUS sends one continuous Ogg Opus stream per req_id.
  // The server decodes it to PCM internally before handing it to driven processing.
  AudioFormat audio_format = 3;
  TransportCompression transport_compression = 4;
  // Egress configuration (optional)
  // If egress_type is UNSPECIFIED or not set, animation data is returned via WebSocket
  EgressType egress_type = 5;
  // LiveKit egress configuration (required when egress_type is EGRESS_TYPE_LIVEKIT)
  LiveKitEgressConfig livekit_egress = 6;
  // Agora egress configuration (required when egress_type is EGRESS_TYPE_AGORA)
  AgoraEgressConfig agora_egress = 7;
}

message ServerConfirmSession {
  string connection_id = 1;
  // 服务端在本连接上支持的可选能力,SDK 据此决定走新路还是回退老路:
  //   "playback_control" —— 接受 CLIENT_PAUSE / CLIENT_RESUME(egress 模式)
  //   "playback_state"   —— 会发 SERVER_PLAYBACK_STATE 回执
  // 没有该字段 / 为空 = 老服务端,SDK 保持 interrupt + 重发的回退路径。
  repeated string capabilities = 2;
}
message ClientAudioInput {
  string req_id = 1;
  // Last message of this req_id. Only a message carrying end drains the ~21 ms filter tail
  // held by the server's resampler, so a segment is not complete until end is sent; it may
  // be sent with empty audio.
  bool end = 2;
  // For AUDIO_FORMAT_OGG_OPUS, audio carries a slice of the continuous Ogg stream.
  // Each req_id must use a single logical stream spanning multiple messages.
  // The final message for the req_id must set end=true.
  bytes audio = 3;
}

message ServerError {
  string connection_id = 1;
  string req_id = 2;
  // Always a CloseCode number, never a gRPC status. A refused or ended session carries the
  // code the close frame repeats; an in-session failure carries the CloseCode it maps to
  // (4010 for an auth failure, 4503 for an unavailable upstream) or 0 (CLOSE_CODE_UNSPECIFIED)
  // when it has no client-facing class — `message` says what happened.
  int32 code = 3;
  string message = 4;
}

message Flame {
  repeated float translation = 1 [packed = true];
  repeated float rotation = 2 [packed = true];
  repeated float neck_pose = 3 [packed = true];
  repeated float jaw_pose = 4 [packed = true];
  repeated float eye_pose = 5 [packed = true];
  repeated float eye_lid = 6 [packed = true];
  repeated float expression = 7 [packed = true];
}

message FlameAnimation {
  repeated Flame keyframes = 1;
}

// Animation frames for one req_id, in order, at 25 fps. The server does not pace or
// rate-limit them: a client applies its own backpressure.
message ServerResponseAnimation {
  string connection_id = 1;
  string req_id = 2;
  // Last frames of this req_id: the server has drained inference for it. It marks the end
  // of a segment, not of the turn — an agent runtime splits one turn into several req_ids at
  // silences — so a client derives "no more frames this turn" from its own end marker (the
  // SDK's end=true, the agent route's turn.end), never from this flag.
  bool end = 3;
  FlameAnimation animation = 4;
  string avatar_id = 5;
}

// Interrupt the whole turn of req_id: audio buffered for it that has not reached inference
// is discarded (never flushed) and the processor is cancelled. Frames already emitted are
// still in flight and reach the client, which must drop them. Contrast ClientPause, which
// discards nothing.
message ClientInterrupt {
  string req_id = 1;
}

// 暂停当前 req_id 的播放。req_id 与服务端当前会话不匹配时被忽略,但仍会收到一条
// SERVER_PLAYBACK_STATE 回执(内容是当前会话的真实状态,req_id 用请求里的那个)。
// 暂停期间客户端应【照常继续发送音频,包括 end=true】—— 服务端只停写出、不停吸入。
// Unlike interrupt, pause cancels nothing and discards no buffered audio; resume continues
// from the same position.
message ClientPause {
  string req_id = 1;
}

// 从暂停点继续播放。未暂停时发 resume 是幂等的(回执 PLAYING)。
message ClientResume {
  string req_id = 1;
}

// 服务端播放状态回执。
//
// 每条 CLIENT_PAUSE / CLIENT_RESUME 都必有一条,内容是操作【之后】的真实状态:
//   pause 被接受        → PAUSED + 位置
//   pause 撞上刚播完    → ENDED + 总长(收到 ENDED 即视为此前的 pause 落空)
//   req_id 不匹配当前会话 → 当前会话的真实状态,req_id 用请求里的那个
//   resume 时并未暂停   → PLAYING + 位置
// 另外播放被打断时服务端主动发一条 INTERRUPTED(reason 见下),暂停超时也走这条
// (reason = "pause_timeout":客户端应按打断收尾,丢弃本地留存,不再尝试 resume)。
// PLAYING / ENDED 也会随播放开始 / 播完主动发出,是 ServerResponseAnimation{end} 之外给新 SDK 的冗余,不替代它。
message ServerPlaybackState {
  string connection_id = 1;
  string req_id = 2;
  enum State {
    STATE_UNSPECIFIED = 0;
    PLAYING = 1;
    PAUSED = 2;
    ENDED = 3;
    INTERRUPTED = 4;
  }
  State state = 3;
  // 已写出的内容毫秒数(不含过渡,暂停期间不推进)。
  int64 played_ms = 4;
  // INTERRUPTED 时:explicit | preempted | pause_timeout
  string reason = 5;
}

message Message {
  MessageType type = 1;
  oneof data {
    ClientConfigureSession client_configure_session = 2;
    ServerConfirmSession server_confirm_session = 3;
    ClientAudioInput client_audio_input = 4;
    ServerError server_error = 5;
    ServerResponseAnimation server_response_animation = 6;
    DrivenIngressConfig driven_config = 7;
    ClientInterrupt client_interrupt = 8;
    ClientPause client_pause = 9;
    ClientResume client_resume = 10;
    ServerPlaybackState server_playback_state = 11;
  }
}

// PreviewAnimationRequest is the internal service-to-service payload used
// by Console to drive a preview. Console authorizes the caller (JWT) and
// resolves the avatar's shape/style/driven config before invoking this RPC,
// so the method carries no user context and is not exposed via HTTP gateway.
